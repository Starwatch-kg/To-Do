<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle">🌙</button>

    <div class="container">
        <div class="header">
            <h1>Привет, {{ user }}! 👋</h1>
            <form action="/logout" method="post">
                <button type="submit" class="logout-btn">Выйти</button>
            </form>
        </div>

        <form action="/add_task_form" method="post" class="add-form">
            <input type="text" name="task" placeholder="Новая задача..." required autocomplete="off">
            <button type="submit" class="add-btn">+</button>
        </form>

        <div class="task-list">
            {% for t in tasks %}
            <div class="task-item">
                <span class="task-text {{ 'done' if t.is_done else '' }}">
                    {{ t.content }}
                </span>

                <div class="actions">
                    <form action="/update_status_form" method="post">
                        <input type="hidden" name="task_id" value="{{ t.id }}">
                        {% if t.is_done %}
                            <input type="hidden" name="new_status" value="False">
                            <button type="submit" class="btn-action btn-undo" title="Вернуть">↩️</button>
                        {% else %}
                            <input type="hidden" name="new_status" value="True">
                            <button type="submit" class="btn-action btn-done" title="Сделано">✅</button>
                        {% endif %}
                    </form>

                    <form action="/delete_task_form" method="post">
                        <input type="hidden" name="task_id" value="{{ t.id }}">
                        <button type="submit" class="btn-action btn-del" title="Удалить">🗑️</button>
                    </form>
                </div>
            </div>
            {% endfor %}
            
            {% if not tasks %}
                <p style="text-align: center; opacity: 0.6;">Задач пока нет ✨</p>
            {% endif %}
        </div>
    </div>

    <script src="/static/theme.js"></script>
</body>
</html>
